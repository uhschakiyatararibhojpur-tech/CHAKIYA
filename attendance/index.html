
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHAKIYA Barcode Attendance</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172554;
    }

    .container {
      max-width: 600px;
      margin: 25px auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 25px #00000012;
    }

    h2 { text-align: center; }
    .subtitle {
      text-align: center;
      color: #64748b;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    button {
      border: 0;
      padding: 13px 18px;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }

    #startBtn { background: #15803d; }
    #stopBtn { background: #dc2626; }
    #manualBtn { background: #1d4ed8; }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 16px;
    }

    .center { text-align: center; }
    .result {
      background: #eff6ff;
      border-radius: 10px;
      padding: 15px;
      margin-top: 20px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>CHAKIYA</h2>
    <p class="subtitle">Class 9 Barcode Attendance System</p>

    <div class="center">
      <button id="startBtn" onclick="startScanner()">Start Camera</button>
      <button id="stopBtn" onclick="stopScanner()">Stop Camera</button>
    </div>

    <div id="reader"></div>

    <h3>Manual Barcode Entry</h3>
    <input id="manualBarcode"
      type="text"
      placeholder="Enter Student ID / Barcode">

    <div class="center">
      <button id="manualBtn" onclick="manualScan()">Test Barcode</button>
    </div>

    <div class="result">
      <strong>Scanner result:</strong>
      <p id="result">Waiting for barcode...</p>
    </div>
  </div>

  <script>
    
const API_URL = "https://script.google.com/macros/s/AKfycbxW7D449J0tM9hyki-Xy8fIYNx9ho7xXkXwHFmGKxpwpbuj-JCbBXcO150Udzod8nK7/exec";

async function apiRequest(action, payload = {}) {
  const response = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      action,
      ...payload
    })
  });

  return await response.json();
}

    let scanner = null;
    let scanning = false;

    async function startScanner() {
      if (!window.Html5Qrcode) {
        alert("Scanner library failed to load. Check internet.");
        return;
      }

      try {
        if (!scanner) {
          scanner = new Html5Qrcode("reader", {
            formatsToSupport: [
              Html5QrcodeSupportedFormats.CODE_128
            ]
          });
        }

        const cameras = await Html5Qrcode.getCameras();

        if (!cameras || cameras.length === 0) {
          throw new Error("No camera detected.");
        }

        const camera = cameras.find(c =>
          /back|rear|environment/i.test(c.label)
        ) || cameras[0];

        await scanner.start(
          camera.id,
          {
            fps: 10,
            qrbox: { width: 300, height: 130 }
          },
          decodedText => {
            document.getElementById("result").textContent =
              "Barcode detected: " + decodedText;
          },
          () => {}
        );

        scanning = true;
        document.getElementById("startBtn").disabled = true;

      } catch (error) {
        alert("Camera error: " + error.message);
        console.error(error);
      }
    }

    async function stopScanner() {
      if (scanner && scanning) {
        await scanner.stop();
        scanning = false;
      }

      document.getElementById("startBtn").disabled = false;
    }

    function manualScan() {
      const value = document.getElementById("manualBarcode")
        .value.trim();

      document.getElementById("result").textContent =
        value ? "Manual barcode entered: " + value :
        "Please enter a barcode.";
    }
  </script>
</body>
</html>
