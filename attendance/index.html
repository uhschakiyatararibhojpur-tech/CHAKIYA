
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHAKIYA Barcode Attendance</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
/* =========================================
   CHAKIYA PROFESSIONAL ATTENDANCE DESIGN
   ========================================= */

:root {
    --navy: #0f172a;
    --navy-light: #1e293b;
    --blue: #2563eb;
    --blue-dark: #1d4ed8;
    --teal: #14b8a6;
    --green: #16a34a;
    --red: #dc2626;
    --orange: #f59e0b;
    --purple: #7c3aed;

    --background: #f1f5f9;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 24px;
    font-family: "Segoe UI", Arial, sans-serif;
    background:
        radial-gradient(
            circle at top left,
            #dbeafe 0,
            transparent 35%
        ),
        #f1f5f9;
    color: var(--text);
    min-height: 100vh;
}

/* =========================================
   MAIN CONTAINER
   ========================================= */

.container {
    max-width: 1100px;
    margin: 25px auto;
    background: transparent;
    padding: 0;
    border-radius: 0;
    box-shadow: none;
}

/* =========================================
   HEADER
   ========================================= */

.container > h2 {
    margin: 0;
    background: linear-gradient(
        135deg,
        #0f172a,
        #1e40af
    );
    color: #ffffff;
    text-align: left;
    padding: 30px 32px 10px;
    border-radius: 24px 24px 0 0;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 1px;
}

.container > .subtitle {
    margin: 0;
    background: linear-gradient(
        135deg,
        #0f172a,
        #1e40af
    );
    color: #cbd5e1;
    text-align: left;
    padding: 0 32px 28px;
    border-radius: 0 0 24px 24px;
    font-size: 15px;
}

/* =========================================
   LOGIN AND ATTENDANCE PANELS
   ========================================= */

#loginPanel,
#attendancePanel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 30px;
    margin-top: 20px;
    box-shadow: 0 12px 40px #0f172a0b;
}

#loginPanel h3,
#attendancePanel h3 {
    font-size: 20px;
    margin: 10px 0 18px;
    color: var(--navy);
    font-weight: 750;
}

/* =========================================
   INPUTS
   ========================================= */

input,
select {
    width: 100%;
    padding: 15px 16px;
    margin: 8px 0 18px;
    border: 1px solid #cbd5e1;
    border-radius: 13px;
    font-size: 16px;
    background: #ffffff;
    color: var(--text);
    outline: none;
    transition: all 0.2s ease;
}

input:focus,
select:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 4px #2563eb15;
}

label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: #475569;
    margin: 10px 0 4px;
}

/* =========================================
   BUTTONS
   ========================================= */

button {
    border: none;
    padding: 13px 20px;
    border-radius: 12px;
    color: white;
    font-weight: 700;
    cursor: pointer;
    margin: 5px;
    transition:
        transform 0.15s,
        box-shadow 0.15s,
        opacity 0.15s;
    font-size: 14px;
}

button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px #00000020;
}

button:active:not(:disabled) {
    transform: scale(0.98);
}

button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.center {
    text-align: center;
}

/* Login */

#loginBtn {
    background: linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );
    min-width: 200px;
}

/* Camera */

#startBtn {
    background: linear-gradient(
        135deg,
        #16a34a,
        #15803d
    );
}

#stopBtn {
    background: linear-gradient(
        135deg,
        #ef4444,
        #dc2626
    );
}

/* Manual Attendance */

#manualBtn {
    background: linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );
}

/* Summary */

#summaryBtn {
    background: linear-gradient(
        135deg,
        #8b5cf6,
        #7c3aed
    );
}

/* Logout */

#logoutBtn {
    background: linear-gradient(
        135deg,
        #475569,
        #334155
    );
}

/* =========================================
   CAMERA SCANNER
   ========================================= */

#reader {
    width: 100%;
    margin: 22px auto;
    border-radius: 20px;
    overflow: hidden;
    background: #020617;
    border: 2px solid #cbd5e1;
    min-height: 250px;
    box-shadow: 0 10px 30px #00000012;
}

#reader video {
    border-radius: 16px;
}

/* =========================================
   RESULT CARDS
   ========================================= */

.result {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
    margin: 18px 0;
    overflow-wrap: anywhere;
    box-shadow: 0 4px 12px #00000004;
}

#teacherInfo {
    margin: 10px 0 0;
    font-weight: 700;
    color: #1d4ed8;
    font-size: 16px;
}

/* =========================================
   HOLIDAY MANAGEMENT
   ========================================= */

#holidayPanel {
    background: linear-gradient(
        135deg,
        #fff7ed,
        #fffbeb
    );
    border: 1px solid #fed7aa;
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 25px;
}

#holidayPanel h3 {
    color: #9a3412;
    font-size: 19px;
}

#holidayBtn {
    background: linear-gradient(
        135deg,
        #f59e0b,
        #d97706
    );
    width: 100%;
    margin: 10px 0;
    padding: 15px;
}

#holidayMessage {
    font-weight: 700;
    margin-top: 14px;
    padding: 12px;
    border-radius: 10px;
}

/* =========================================
   ATTENDANCE SECTION HEADINGS
   ========================================= */

#attendancePanel > h3 {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 28px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
}

#attendancePanel > h3:first-of-type {
    margin-top: 28px;
}

/* =========================================
   MANUAL BARCODE
   ========================================= */

#manualBarcode {
    font-family: monospace;
    letter-spacing: 1px;
    font-size: 17px;
}

/* =========================================
   ATTENDANCE RESULT
   ========================================= */

#result {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-weight: 700;
    line-height: 1.8;
    font-size: 15px;
    color: #334155;
}

#summary {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-family: "Segoe UI", Arial, sans-serif;
    line-height: 1.8;
    margin: 12px 0 0;
    color: #334155;
    font-size: 14px;
}

/* =========================================
   STATUS
   ========================================= */

.status {
    font-weight: bold;
    margin-top: 12px;
}

.hidden {
    display: none !important;
}

/* =========================================
   BUTTON LAYOUT
   ========================================= */

#attendancePanel .center button {
    margin: 7px;
}

/* =========================================
   RESULT HIGHLIGHT
   ========================================= */

#attendancePanel .result strong {
    color: #0f172a;
    font-size: 15px;
}

#attendancePanel .result:nth-last-of-type(1) {
    background: linear-gradient(
        135deg,
        #f8fafc,
        #eff6ff
    );
}

/* =========================================
   SCANNER ANIMATION
   ========================================= */

@keyframes scannerPulse {
    0% {
        box-shadow: 0 0 0 0 #14b8a650;
    }

    70% {
        box-shadow: 0 0 0 10px #14b8a600;
    }

    100% {
        box-shadow: 0 0 0 0 #14b8a600;
    }
}

#startBtn:not(:disabled) {
    animation: scannerPulse 2s infinite;
}

/* =========================================
   RESPONSIVE DESIGN
   ========================================= */

@media (max-width: 700px) {

    body {
        padding: 10px;
    }

    .container {
        margin: 8px auto;
    }

    .container > h2 {
        padding: 24px 20px 8px;
        font-size: 25px;
    }

    .container > .subtitle {
        padding: 0 20px 24px;
        font-size: 13px;
    }

    #loginPanel,
    #attendancePanel {
        padding: 18px;
        border-radius: 20px;
    }

    button {
        margin: 4px 2px;
        padding: 13px 15px;
    }

    #reader {
        min-height: 210px;
        border-radius: 16px;
    }

    #holidayPanel {
        padding: 18px;
    }

    #attendancePanel .center {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
    }

    #attendancePanel .center button {
        flex: 1;
        min-width: 120px;
    }

    #loginBtn {
        width: 100%;
    }

    input,
    select {
        font-size: 16px;
    }
}

/* =========================================
   LARGE SCREEN
   ========================================= */

@media (min-width: 1100px) {

    .container {
        max-width: 1100px;
    }

    #attendancePanel {
        padding: 35px;
    }

}
</style>
</head>

<body>

<div class="container">

  <h2>CHAKIYA</h2>
  <p class="subtitle">Class 9 Barcode Attendance System</p>

  <!-- TEACHER LOGIN -->
  <div id="loginPanel">

      id="teacherId"

<script>

// ========================================
// CONFIGURATION
// ========================================

const API_URL =
"https://script.google.com/macros/s/AKfycbxW7D449J0tM9hyki-Xy8fIYNx9ho7xXkXwHFmGKxpwpbuj-JCbBXcO150Udzod8nK7/exec";

let sessionToken = null;
let teacherData = null;
let scanner = null;

let scanning = false;
let submitting = false;

let lastBarcode = "";
let lastScanTime = 0;

// Shared audio context
let audioContext = null;


// ========================================
// API REQUEST
// ========================================

async function apiRequest(action, payload = {}) {

  const response = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      action,
      ...payload
    })
  });

  if (!response.ok) {
    throw new Error("Server connection failed. HTTP " + response.status);
  }

  return await response.json();
}


// ========================================
// AUDIO UNLOCK
// ========================================

async function unlockAudio() {

  try {

    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) {
      console.log("AudioContext is not supported.");
      return;
    }

    if (!audioContext) {
      audioContext = new AudioContextClass();
    }

    if (audioContext.state === "suspended") {
      await audioContext.resume();
    }

    // Silent sound to unlock browser audio
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    gain.gain.value = 0;

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + 0.02);

  } catch (error) {
    console.log("Audio unlock failed:", error);
  }
}

// ========================================
// VOICE ANNOUNCEMENT
// ========================================

function speakPresent(studentName) {
  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const message = new SpeechSynthesisUtterance(
    "Present Sir. " + studentName
  );

  message.lang = "en-IN";
  message.rate = 1;
  message.pitch = 1;
  message.volume = 1;

  window.speechSynthesis.speak(message);
}
// ========================================
// SUCCESS BEEP + VIBRATION
// ========================================

function playSuccessBeep() {

  try {

    if (audioContext && audioContext.state === "running") {

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.type = "sine";
      oscillator.frequency.value = 1100;

      gain.gain.setValueAtTime(
        0.4,
        audioContext.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.3
      );

      oscillator.start();

      oscillator.stop(
        audioContext.currentTime + 0.3
      );

    }

  } catch (error) {
    console.log("Beep sound unavailable:", error);
  }

  // Mobile vibration
  try {
    if ("vibrate" in navigator) {
      navigator.vibrate(200);
    }
  } catch (error) {
    console.log("Vibration unavailable:", error);
  }
}


// ========================================
// RESULT MESSAGE
// ========================================

function showResult(message) {

  document.getElementById("result").textContent = message;

}
  
/************ HOLIDAY MANAGEMENT ************/

function setupHolidayPanel() {

  const panel = document.getElementById("holidayPanel");

  // Only show the feature to Admin.
  if (teacherData && teacherData.role === "Admin") {
    panel.classList.remove("hidden");
  } else {
    panel.classList.add("hidden");
  }

  // Set today's date as the default date.
  const today = new Date();

  document.getElementById("holidayDate").value =
    today.getFullYear() + "-" +
    String(today.getMonth() + 1).padStart(2, "0") + "-" +
    String(today.getDate()).padStart(2, "0");
}


async function declareHoliday() {

  if (!sessionToken) {
    alert("Please login first.");
    return;
  }

  if (!teacherData || teacherData.role !== "Admin") {
    alert("Only Admin can declare a school holiday.");
    return;
  }

  const date = document.getElementById("holidayDate").value;
  const reason = document.getElementById("holidayReason").value.trim();

  const button = document.getElementById("holidayBtn");
  const message = document.getElementById("holidayMessage");

  if (!date) {
    message.textContent = "Please select a date.";
    return;
  }

  if (!reason) {
    message.textContent = "Please enter the holiday reason.";
    return;
  }

  if (!confirm(
    "Declare " + reason + " as a school holiday on " + date + "?"
  )) {
    return;
  }

  button.disabled = true;
  button.textContent = "Declaring...";
  message.textContent = "Please wait...";

  try {

    const response = await apiRequest("declareHoliday", {
      token: sessionToken,
      date: date,
      reason: reason
    });

    if (!response.success) {
      throw new Error(response.message || "Could not declare holiday.");
    }

    const data = response.data || {};

    message.textContent =
      "✓ " + (data.message || "Holiday declared successfully.");

    message.style.color = "#15803d";

    document.getElementById("holidayReason").value = "";

  } catch (error) {

    message.textContent = "Error: " + error.message;
    message.style.color = "#dc2626";

  } finally {

    button.disabled = false;
    button.textContent = "Declare Holiday";

  }
}

  
/************ HOLIDAY MANAGEMENT ************/

function setupHolidayPanel() {

  const panel = document.getElementById("holidayPanel");

  // Only show the feature to Admin.
  if (teacherData && teacherData.role === "Admin") {
    panel.classList.remove("hidden");
  } else {
    panel.classList.add("hidden");
  }

  // Set today's date as the default date.
  const today = new Date();

  document.getElementById("holidayDate").value =
    today.getFullYear() + "-" +
    String(today.getMonth() + 1).padStart(2, "0") + "-" +
    String(today.getDate()).padStart(2, "0");
}


async function declareHoliday() {

  if (!sessionToken) {
    alert("Please login first.");
    return;
  }

  if (!teacherData || teacherData.role !== "Admin") {
    alert("Only Admin can declare a school holiday.");
    return;
  }

  const date = document.getElementById("holidayDate").value;
  const reason = document.getElementById("holidayReason").value.trim();

  const button = document.getElementById("holidayBtn");
  const message = document.getElementById("holidayMessage");

  if (!date) {
    message.textContent = "Please select a date.";
    return;
  }

  if (!reason) {
    message.textContent = "Please enter the holiday reason.";
    return;
  }

  if (!confirm(
    "Declare " + reason + " as a school holiday on " + date + "?"
  )) {
    return;
  }

  button.disabled = true;
  button.textContent = "Declaring...";
  message.textContent = "Please wait...";

  try {

    const response = await apiRequest("declareHoliday", {
      token: sessionToken,
      date: date,
      reason: reason
    });

    if (!response.success) {
      throw new Error(response.message || "Could not declare holiday.");
    }

    const data = response.data || {};

    message.textContent =
      "✓ " + (data.message || "Holiday declared successfully.");

    message.style.color = "#15803d";

    document.getElementById("holidayReason").value = "";

  } catch (error) {

    message.textContent = "Error: " + error.message;
    message.style.color = "#dc2626";

  } finally {

    button.disabled = false;
    button.textContent = "Declare Holiday";

  }

// ========================================
// TEACHER LOGIN
// ========================================

async function teacherLogin() {

  const teacherId =
    document.getElementById("teacherId").value.trim();

  const pin =
    document.getElementById("teacherPin").value.trim();

  if (!teacherId || !pin) {
    alert("Please enter Teacher ID and PIN.");
    return;
  }

  const btn = document.getElementById("loginBtn");

  btn.disabled = true;
  btn.textContent = "Logging in...";

  try {

    const response = await apiRequest("login", {
      teacherId: teacherId,
      pin: pin
    });

    if (!response.success) {
      throw new Error(response.message || "Login failed.");
    }

    const data = response.data;

    if (!data || !data.token) {
      throw new Error(
        "Login response did not contain a session token."
      );
    }

    sessionToken = data.token;
    teacherData = data.teacher || {};
    setupHolidayPanel();

    document.getElementById("loginPanel")
      .classList.add("hidden");

    document.getElementById("attendancePanel")
      .classList.remove("hidden");

    document.getElementById("teacherInfo").textContent =
      teacherData.teacherName ||
      teacherData.name ||
      teacherId;

    showResult("Login successful. Ready to scan.");

  } catch (error) {

    alert("Login error: " + error.message);

  } finally {

    btn.disabled = false;
    btn.textContent = "Login";

  }
}


// ========================================
// START CAMERA SCANNER
// ========================================

async function startScanner() {

  if (!sessionToken) {
    alert("Please login first.");
    return;
  }

  if (!window.Html5Qrcode) {
    alert("Scanner library failed to load.");
    return;
  }

  if (scanning) {
    return;
  }

  try {

    // Unlock audio directly from Start Camera click
    await unlockAudio();

    if (!scanner) {

      scanner = new Html5Qrcode("reader", {

        formatsToSupport: [
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.QR_CODE
        ],

        verbose: false

      });

    }

    const cameras = await Html5Qrcode.getCameras();

    if (!cameras || cameras.length === 0) {
      throw new Error("No camera detected.");
    }

    const camera = cameras.find(c =>
      /back|rear|environment/i.test(c.label)
    ) || cameras[0];

    await scanner.start(

      camera.id,

      {
    fps: 20,

    qrbox: function(viewfinderWidth, viewfinderHeight) {
        return {
            width: Math.floor(viewfinderWidth * 0.95),
            height: Math.min(
                140,
                Math.floor(viewfinderHeight * 0.35)
            )
        };
    },

    aspectRatio: 1.777,

    videoConstraints: {
        facingMode: "environment",
        width: { ideal: 1280 },
        height: { ideal: 720 }
    }
},
      decodedText => {
        processBarcode(decodedText);
      },

      () => {}

    );

    scanning = true;

    document.getElementById("startBtn").disabled = true;

    showResult("Camera started. Scan a student barcode.");

  } catch (error) {

    scanning = false;

    document.getElementById("startBtn").disabled = false;

    alert("Camera error: " + error.message);

    console.error(error);

  }

}


// ========================================
// STOP CAMERA
// ========================================

async function stopScanner() {

  try {

    if (scanner && scanning) {

      await scanner.stop();

      scanning = false;

    }

  } catch (error) {

    console.error("Camera stop error:", error);

  }

  document.getElementById("startBtn").disabled = false;

}


// ========================================
// PROCESS BARCODE
// ========================================

async function processBarcode(barcode) {

  barcode = String(barcode).trim();

  if (!barcode || !sessionToken || submitting) {
    return;
  }

  const now = Date.now();

  // Prevent repeated camera reads of same barcode
  if (
    barcode === lastBarcode &&
    now - lastScanTime < 4000
  ) {
    return;
  }

  lastBarcode = barcode;
  lastScanTime = now;

  submitting = true;

  const manualBtn = document.getElementById("manualBtn");

  manualBtn.disabled = true;

  showResult("Submitting attendance for " + barcode + "...");

  try {

    const response = await apiRequest("mark", {
  token: sessionToken,
  barcode: barcode
});
    if (!response.success) {
      throw new Error(
        response.message || "Attendance failed."
      );
    }

    const data = response.data || {};

    if (data.success === false) {
      throw new Error(
        data.message || "Attendance not recorded."
      );
    }

 // Successful attendance: voice and vibration
const studentName =
  data.studentName || data.name || "Student";

if (!data.duplicate) {
  speakPresent(studentName);
  if ("vibrate" in navigator) {
    navigator.vibrate(100);
  }
}

    const rollNo =
      data.rollNo || "";

    const section =
      data.section || "";

    const duplicate =
      data.duplicate === true;

    if (duplicate) {

      showResult(
        "ALREADY MARKED\n\n" +
        "Student: " + studentName + "\n" +
        "Roll No: " + rollNo + "\n" +
        "Section: " + section
      );

    } else {

      showResult(
        "ATTENDANCE SUBMITTED SUCCESSFULLY!\n\n" +
        "Student: " + studentName + "\n" +
        "Roll No: " + rollNo + "\n" +
        "Section: " + section
      );

    }

    // Clear manual barcode field
    document.getElementById("manualBarcode").value = "";

  } catch (error) {

    showResult("ERROR: " + error.message);

    console.error("Attendance submission error:", error);

  } finally {

    submitting = false;
    manualBtn.disabled = false;

  }

}


// ========================================
// MANUAL BARCODE ENTRY
// ========================================

function manualScan() {

  const value =
    document.getElementById("manualBarcode")
      .value.trim();

  if (!value) {
    alert("Please enter a barcode.");
    return;
  }

  processBarcode(value);

}


// ========================================
// TODAY'S ATTENDANCE SUMMARY
// ========================================

async function loadSummary() {

  if (!sessionToken) {
    return;
  }

  const section =
    teacherData.assignedSection ||
    teacherData.section ||
    "A";

  document.getElementById("summary").textContent =
    "Loading...";

  try {

    const response = await apiRequest("summary", {
      token: sessionToken,
      section: section
    });

    if (!response.success) {
      throw new Error(
        response.message || "Could not load summary."
      );
    }

    document.getElementById("summary").textContent =
      JSON.stringify(response.data, null, 2);

  } catch (error) {

    document.getElementById("summary").textContent =
      "Error: " + error.message;

  }

}


// ========================================
// TEACHER LOGOUT
// ========================================

async function teacherLogout() {

  await stopScanner();

  try {

    await apiRequest("logout", {
      token: sessionToken
    });

  } catch (error) {

    console.error("Logout error:", error);

  }

  sessionToken = null;
  teacherData = null;

  lastBarcode = "";
  lastScanTime = 0;

  document.getElementById("attendancePanel")
    .classList.add("hidden");

  document.getElementById("loginPanel")
    .classList.remove("hidden");

  document.getElementById("teacherPin").value = "";

  document.getElementById("teacherId").value = "";

  document.getElementById("summary").textContent =
    "Click Today's Summary.";

  showResult("Logged out.");

}
