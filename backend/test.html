<!DOCTYPE html>
<html>
<head>
    <title>CHAKIYA Backend Test</title>
</head>
<body>

<h2>CHAKIYA Backend Test</h2>

<button onclick="testStudent()">ADD TEST STUDENT</button>

<p id="result"></p>

<script>
async function testStudent() {

    const student = {
        student_name: "TEST STUDENT",
        father_name: "TEST FATHER",
        mother_name: "TEST MOTHER",
        class_name: "9",
        mobile: "9999999999",
        admission_number: "TEST001"
    };

    try {

        const response = await fetch(
            "https://chakiya.onrender.com/api/students",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(student)
            }
        );

        const data = await response.json();

        document.getElementById("result").textContent =
            JSON.stringify(data);

    } catch (error) {

        document.getElementById("result").textContent =
            "ERROR: " + error.message;

    }
}
</script>

</body>
</html>
