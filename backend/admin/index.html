<!DOCTYPE html>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .header {
            background: #0a2743;
            color: white;
            padding: 20px;

        .header h1 {
            margin: 0;
            font-size: 26px;
        }

        .header p {
            margin: 6px 0 0;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 15px;

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;

        .stat {

        th,

            padding: 12px;

            text-align: left;

        th {

        .status {

        @media (max-width: 700px) {

            }

async function checkLogin() {

    const { data } =
        await supabaseClient.auth.getSession();

    if (!data.session) {
        window.location.href = "login.html";
    }
}

    async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href = "login.html";
}

const API_URL = "https://chakiya.onrender.com/api/students";

let students = [];

async function loadStudents() {

    try {

        const response = await fetch(API_URL);

        const result = await response.json();

        if (!result.success) {
            throw new Error("Unable to load students");
        }

        students = result.students;

        updateDashboard();

        document.getElementById("status").textContent =
            "Students loaded successfully.";

    } catch (error) {

        document.getElementById("status").textContent =
            "ERROR: " + error.message;

    }
}

    students.length;

document.getElementById("search").addEventListener("input", filterStudents);

document.getElementById("classFilter").addEventListener("change", filterStudents);

function filterStudents() {

    const searchText =
        document.getElementById("search").value.toLowerCase();

    const selectedClass =
        document.getElementById("classFilter").value;

    const filtered = students.filter(student => {

        const nameMatch =
            (student.student_name || "")
                .toLowerCase()
                .includes(searchText);

        const classMatch =
            !selectedClass ||
            student.class_name === selectedClass;

        return nameMatch && classMatch;
    });

    displayStudents(filtered);
}
function openStudentPhoto(studentId) {

    const photo =
        document.getElementById(
            `student-photo-${studentId}`
        );

    if (!photo || !photo.src) {
        return;
    }

    const overlay =
        document.createElement("div");

    overlay.id = "photoOverlay";

    overlay.style.cssText = `
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.75);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    z-index:9999;
    padding:80px 20px 20px;
    overflow-y:auto;
`;

    const largePhoto =
        document.createElement("img");

    largePhoto.src = photo.src;

    largePhoto.style.cssText = `
        max-width:90%;
        max-height:90%;
        object-fit:contain;
        border-radius:10px;
        box-shadow:0 0 25px rgba(255,255,255,0.3);
        cursor:default;
    `;

    overlay.appendChild(largePhoto);

    overlay.addEventListener("click", function(event) {

        if (event.target === overlay) {
            overlay.remove();
        }

    });

    document.body.appendChild(overlay);
}

    async function saveStudentEdit(studentId) {

    const student = students.find(s => s.id == studentId);

    if (!student) {
        return;
    }

    const updatedStudent = {
        student_name: document.getElementById("editStudentName").value,
        father_name: document.getElementById("editFatherName").value,
        mother_name: document.getElementById("editMotherName").value,
        class_name: document.getElementById("editClassName").value,
        date_of_birth: document.getElementById("editDateOfBirth").value,
        gender: document.getElementById("editGender").value,
        mobile: document.getElementById("editMobile").value,
        admission_number: document.getElementById("editAdmissionNumber").value
    };

    try {

        const response = await fetch(
            `https://chakiya.onrender.com/api/students/${studentId}`,
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(updatedStudent)
            }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(
                result.error?.message ||
                result.error ||
                "Unable to update student"
            );
        }

        alert("Student updated successfully.");

        const editOverlay = document.getElementById("editStudentOverlay");

if (editOverlay) {
    editOverlay.remove();
}

        await loadStudents();

    } catch (error) {

        console.error("Student update error:", error);

        alert(
            "ERROR: " + error.message
        );
    }
}
    async function deleteStudent(studentId) {

    const student = students.find(s => s.id == studentId);

    if (!student) {
        return;
    }

    const confirmed = confirm(
        "Are you sure you want to delete this student?\n\n" +
        "Student: " + (student.student_name || "") +
        "\nAdmission No.: " + (student.admission_number || "")
    );

    if (!confirmed) {
        return;
    }

    try {

        const response = await fetch(
            `https://chakiya.onrender.com/api/students/${studentId}`,
            {
                method: "DELETE"
            }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(
                result.error?.message ||
                result.error ||
                "Unable to delete student"
            );
        }

        alert("Student deleted successfully.");

        await loadStudents();

    } catch (error) {

        console.error("Student delete error:", error);

        alert(
            "ERROR: " + error.message
        );
    }
}

    async function saveNewStudent() {
const photoInput = document.getElementById("addStudentPhoto");

const photoFile =
    photoInput && photoInput.files.length > 0
        ? photoInput.files[0]
        : null;
    const newStudent = {
        student_name: document.getElementById("addStudentName").value.trim(),
        father_name: document.getElementById("addFatherName").value.trim(),
        mother_name: document.getElementById("addMotherName").value.trim(),
        class_name: document.getElementById("addClassName").value.trim(),
        date_of_birth: document.getElementById("addDateOfBirth").value,
        gender: document.getElementById("addGender").value,
        mobile: document.getElementById("addMobile").value.trim(),
        admission_number: document.getElementById("addAdmissionNumber").value.trim()
    };
let studentPhotoBase64 = "";

if (photoFile) {

    studentPhotoBase64 = await new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);

        reader.onerror = () =>
            reject(new Error("Unable to read student photo."));

        reader.readAsDataURL(photoFile);
    });
}
    if (!newStudent.student_name) {
        alert("Please enter Student Name.");
        return;
    }

    if (!newStudent.class_name) {
        alert("Please enter Class.");
        return;
    }

    try {

        const response = await fetch(
            "https://chakiya.onrender.com/api/students",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
    ...newStudent,
    student_photo: studentPhotoBase64
})
            }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(
                result.error?.message ||
                result.error ||
                "Unable to add student"
            );
        }

        alert("Student added successfully.");

        const addOverlay =
            document.getElementById("addStudentOverlay");

        if (addOverlay) {
            addOverlay.remove();
        }

        await loadStudents();

    } catch (error) {

        console.error(
            "Student registration error:",
            error
        );

        alert(
            "ERROR: " + error.message
        );
    }
}
loadStudents();

    async function saveAttendance(studentId, status) {

    const attendanceDate =
        document.getElementById("attendanceDate").value;

    if (!attendanceDate) {
        alert("Please select attendance date.");
        return;
    }

    try {

        const response = await fetch(
            "https://chakiya.onrender.com/api/attendance",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    student_id: studentId,
                    attendance_date: attendanceDate,
                    status: status
                })
            }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(
                result.error?.message ||
                result.error ||
                "Unable to save attendance."
            );
        }

        alert("Attendance saved: " + status);

    } catch (error) {

        console.error("Attendance error:", error);

        alert("ERROR: " + error.message);
    }
}
