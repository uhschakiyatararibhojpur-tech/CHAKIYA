<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Gallery | UHS Chakiya Tarari Bhojpur</title>
  <meta name="description" content="Explore school activities, campus photographs and student achievements at UHS Chakiya Tarari, Bhojpur, Bihar.">
  <link rel="canonical" href="https://uhschakiyatarari.in/gallery.html">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #203047;
    }
    header {
      background: #123c69;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }
    header h1 { margin: 0 0 10px; }
    header p { margin: 0; }
    nav {
      background: #092947;
      padding: 13px;
      text-align: center;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 12px;
      font-weight: bold;
    }
    main {
      max-width: 1100px;
      margin: auto;
      padding: 25px 16px;
    }
    .intro { text-align: center; margin-bottom: 25px; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }
    .photo {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px #00000012;
    }
    .photo img {
      display: block;
      width: 100%;
      height: 210px;
      object-fit: cover;
    }
    .photo p {
      padding: 12px;
      margin: 0;
      text-align: center;
      font-weight: bold;
    }
    footer {
      text-align: center;
      background: #123c69;
      color: white;
      padding: 20px;
      margin-top: 30px;
    }
    footer a { color: white; }
  </style>
</head>
<body>
  <header>
    <h1>UHS Chakiya Tarari</h1>
    <p>School Gallery | Bhojpur, Bihar</p>
  </header>

  <nav>
    <a href="/">Home</a>
    <a href="/about.html">About Us</a>
    <a href="/gallery.html">Gallery</a>
  </nav>

  <main>
    <section class="intro">
      <h2>Our School Gallery</h2>
      <p>Glimpses of our campus, learning activities and school life.</p>
    </section>

    <section class="gallery" aria-label="School photographs">
      <article class="photo">
        <img src="/SCHOOL2.jpg" alt="UHS Chakiya school campus" loading="lazy">
        <p>Our School Campus</p>
      </article>
      <article class="photo">
        <img src="/SCHOOL3.jpg" alt="School building and surroundings" loading="lazy">
        <p>School Building</p>
      </article>
      <article class="photo">
        <img src="/SCHOOL4.jpg" alt="School campus photograph" loading="lazy">
        <p>Our Campus</p>
      </article>
      <article class="photo">
        <img src="/SCHOOL5.jpg" alt="Another view of the school" loading="lazy">
        <p>School Environment</p>
      </article>
    </section>
  </main>

  <footer>
    <p>UHS Chakiya Tarari, Bhojpur, Bihar</p>
    <p><a href="/">Visit School Homepage</a></p>
  </footer>
</body>
</html>
